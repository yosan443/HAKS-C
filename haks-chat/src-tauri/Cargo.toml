[package]
name = "haks-chat"
version = "0.1.0"
description = "HAKS Quick Chat"
authors = ["you"]
edition = "2021"

[lib]
name = "haks_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
haks-core = { path = "../../haks-core" }
tauri = { version = "2" }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.13.1", default-features = false, features = ["native-tls", "json"] }
futures-util = "0.3"
base64 = "0.22"
